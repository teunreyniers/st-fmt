name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # --workspace so that bindings/ffi is covered too; without it cargo only
    # looks at the root package and the C ABI goes untested.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Build the Python package
      run: python3 bindings/python/build.py
    - name: Test the Python bindings
      run: python3 -m unittest discover -s bindings/python/tests --verbose
