name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    # --workspace so that bindings/ffi is covered too; without it cargo only
    # looks at the root package and the C ABI goes untested.
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --all --check
    # --all-targets so the lint reaches tests, examples and benches, not just
    # the library and the binary.
    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
